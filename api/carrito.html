<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Carrito de Compras</h2>
        <form id="formCarrito" action="procesar_carrito.php" method="post">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody id="carritoItems">
                    <!-- Aquí se agregarán dinámicamente los productos -->
                </tbody>
            </table>
            <div class="text-end">
                <h4>Total: $<span id="totalCarrito">0.00</span></h4>
                <button type="submit" class="btn btn-success">Finalizar Compra</button>
            </div>
        </form>
    </div>

    <script>
        // Simular productos almacenados en localStorage (puedes conectarlo a JS real después)
        const productos = JSON.parse(localStorage.getItem('carrito')) || [];

        const carritoItems = document.getElementById('carritoItems');
        const totalCarrito = document.getElementById('totalCarrito');

        function actualizarCarrito() {
            carritoItems.innerHTML = '';
            let total = 0;

            productos.forEach((producto, index) => {
                const subtotal = producto.precio * producto.cantidad;
                total += subtotal;

                carritoItems.innerHTML += `
                    <tr>
                        <td><input type="hidden" name="producto[${index}][nombre]" value="${producto.nombre}">${producto.nombre}</td>
                        <td><input type="hidden" name="producto[${index}][precio]" value="${producto.precio}">$${producto.precio}</td>
                        <td>
                            <input type="number" name="producto[${index}][cantidad]" value="${producto.cantidad}" min="1" class="form-control cantidad-input" data-index="${index}">
                        </td>
                        <td>$${subtotal.toFixed(2)}</td>
                        <td><button type="button" class="btn btn-danger btn-sm eliminar" data-index="${index}">X</button></td>
                    </tr>
                `;
            });

            totalCarrito.textContent = total.toFixed(2);
        }

        carritoItems.addEventListener('click', (e) => {
            if (e.target.classList.contains('eliminar')) {
                const index = e.target.dataset.index;
                productos.splice(index, 1);
                localStorage.setItem('carrito', JSON.stringify(productos));
                actualizarCarrito();
            }
        });

        carritoItems.addEventListener('input', (e) => {
            if (e.target.classList.contains('cantidad-input')) {
                const index = e.target.dataset.index;
                productos[index].cantidad = parseInt(e.target.value) || 1;
                localStorage.setItem('carrito', JSON.stringify(productos));
                actualizarCarrito();
            }
        });

        actualizarCarrito();
    </script>
</body>
</html>
